<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>مبدل متن ترکیبی</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#fafafa;font-family:'Vazirmatn',sans-serif;min-height:100vh;padding:1.5rem;display:flex;justify-content:center;align-items:flex-start;line-height:1.6;color:#1a1a1a}.container{width:100%;max-width:800px;background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:2rem}.header{text-align:center;margin-bottom:2rem}.header h1{font-size:1.5rem;font-weight:700;margin-bottom:.5rem}.header-desc{font-size:.85rem;color:#666}.main-content{display:flex;flex-direction:column;gap:1.5rem}.section{display:flex;flex-direction:column;gap:.5rem}.section-title{font-size:.9rem;font-weight:500}textarea{width:100%;min-height:150px;padding:1rem;font-size:.95rem;line-height:1.8;border:1px solid #e0e0e0;border-radius:12px;background:#fefefe;resize:vertical;outline:none;transition:border-color .2s;font-family:'Vazirmatn',sans-serif}textarea:focus{border-color:#2563eb}textarea::placeholder{color:#999}.output-box{width:100%;min-height:150px;padding:1rem;font-size:.95rem;line-height:1.8;border:1px solid #e0e0e0;border-radius:12px;background:#fefefe;white-space:pre-wrap;word-break:break-word;overflow-y:auto}.output-box .placeholder{color:#999;font-style:italic}.actions{display:flex;gap:.75rem;margin-top:.5rem}.btn{flex:1;padding:.7rem;font-size:.9rem;font-weight:500;border:1px solid #e0e0e0;border-radius:12px;cursor:pointer;transition:all .2s;font-family:'Vazirmatn',sans-serif;background:#fff}.btn:active{transform:scale(.98)}.btn-primary{background:#2563eb;border-color:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8}.btn-primary.btn-success{background:#22c55e;border-color:#22c55e}.btn-secondary:hover{background:#f5f5f5}@media(max-width:640px){body{padding:.75rem}.container{padding:1.25rem}.header h1{font-size:1.25rem}textarea,.output-box{min-height:120px;padding:.75rem;font-size:.9rem}.actions{flex-direction:column}}</style></head><body><div class="container"><header class="header"><h1>مبدل متن ترکیبی راست‌چین و چپ‌چین</h1><p class="header-desc">تبدیل متن ترکیبی فارسی و انگلیسی با کاراکترهای نامرئی یونیکد مانند U+202B و U+202A و U+202C</p></header><main class="main-content"><section class="section"><label class="section-title">متن ورودی</label><textarea id="it" placeholder="متن ترکیبی خود را اینجا بنویسید..." spellcheck="false"></textarea></section><section class="section"><label class="section-title">خروجی اصلاح‌شده</label><div id="ob" class="output-box"><span class="placeholder">خروجی اینجا نمایش داده می‌شود...</span></div></section><div class="actions"><button id="cb" class="btn btn-primary">کپی خروجی</button><button id="cl" class="btn btn-secondary">پاک</button></div></main></div><script>const it=document.getElementById('it'),ob=document.getElementById('ob'),cb=document.getElementById('cb'),cl=document.getElementById('cl'),RLE='\u202B',LRE='\u202A',PDF='\u202C',P=c=>{const n=c.charCodeAt(0);return(n>=0x0590&&n<=0x05FF)||(n>=0x0600&&n<=0x06FF)||(n>=0x0750&&n<=0x077F)||(n>=0x08A0&&n<=0x08FF)||(n>=0xFB50&&n<=0xFDFF)||(n>=0xFE70&&n<=0xFEFF)},D=c=>{const n=c.charCodeAt(0);return n>=0x06F0&&n<=0x06F9},L=c=>{const n=c.charCodeAt(0);return(n>=0x20&&n<=0x7E)||(n>=0xA0&&n<=0xFF)||(n>=0x100&&n<=0x17F)||(n>=0x180&&n<=0x24F)||(n>=0x2000&&n<=0x206F)||(n>=0x20A0&&n<=0x20CF)||(n>=0x2100&&n<=0x214F)||(n>=0x2190&&n<=0x21FF)||(n>=0x2200&&n<=0x22FF)||(n>=0x2300&&n<=0x23FF)},W=c=>c===' '||c==='\t'||c==='\n'||c==='\r',S=s=>{let l=0,r=0;for(let c of s){L(c)&&!W(c)?l=1:P(c)||D(c)?r=1:0}return l&&!r},N=t=>t?t.split('\n').map(l=>l.trim()?RLE+l.split(/(\s+)/).map(p=>p&&p.trim()&&S(p)?LRE+p+PDF:p).join('')+PDF:'').join('\n'):'',U=()=>{const v=it.value,n=N(v);n?ob.textContent=n:ob.innerHTML='<span class="placeholder">خروجی اینجا نمایش داده می‌شود...</span>'};cb.onclick=()=>{const t=ob.textContent;if(!t||ob.querySelector('.placeholder'))return;navigator.clipboard.writeText(t).then(()=>{cb.textContent='کپی شد';cb.classList.add('btn-success');setTimeout(()=>{cb.textContent='کپی خروجی';cb.classList.remove('btn-success')},1500)})};cl.onclick=()=>{ob.innerHTML='<span class="placeholder">خروجی اینجا نمایش داده می‌شود...</span>'};it.addEventListener('input',U);U();</script></body></html>
